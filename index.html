<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snorbik AI Platform — Plateforme IA locale pour développeurs</title>
  <meta name="description" content="Plateforme IA locale pour développeurs — LLM en local, Gateway OpenAI, Ollama.">
  <style>
    :root {
      --bg: #0d1117;
      --border: #263244;
      --text: #d6deeb;
      --muted: #8b98aa;
      --accent: #3794ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      font-size: 15px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 48px 20px 64px;
    }

    h1 {
      font-size: 1.75rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .demo img {
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    footer {
      margin-top: 32px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }

    footer a { color: var(--accent); }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Snorbik AI Platform</h1>
    <p class="sub">Plateforme IA locale pour développeurs — LLM en local · Gateway OpenAI · Ollama · Cursor / VS Code / Codex</p>
    <div class="demo">
      <img src="assets/gifs/demo-2.gif" alt="Snorbik AI Platform">
    </div>
    <footer>
      <a href="https://github.com/ta-dev-ai/snorbik-ai-platform">GitHub</a>
    </footer>
  </div>
</body>

</html>
